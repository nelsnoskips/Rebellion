# ---------------------------------------------------------------------------
# Fallback for Plesk hosts, where nginx sits in front of Apache.
#
# Only needed if the .htaccess does not take effect — the symptom is clean URLs
# like /rebellionbistro/menus returning WordPress's themed 404 while
# /rebellionbistro/menus.html works. That means nginx is serving this directory
# itself and never handing the request to Apache, so Apache never reads the
# .htaccess.
#
# Paste into Plesk:
#   Websites & Domains -> rebellionrestaurants.com -> Apache & nginx Settings
#   -> Additional nginx directives
#
# A `location` prefix match beats the generic `location /` that WordPress runs
# through, so these win for this directory and nothing else changes.
# ---------------------------------------------------------------------------

location /rebellionbistro/ {
    # A real file, then a directory, then the exported .html — which is what
    # turns /menus into menus.html. Anything left is genuinely missing and is
    # answered here rather than by WordPress.
    try_files $uri $uri/ $uri.html =404;
    error_page 404 /rebellionbistro/404.html;
}

# Fingerprinted assets: a changed file is a different URL, so this can never
# serve a stale one.
location ^~ /rebellionbistro/_next/static/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}
