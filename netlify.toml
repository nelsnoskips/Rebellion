# Netlify configuration for the Rebellion Beachside site.
#
# The Next build is a static export (see next.config.ts), so the publish
# directory is `out` — plain HTML, CSS, JS and images with a real index.html at
# the root. Publishing `.next` instead is what produces Netlify's "Page not
# found": that directory has no servable index at its root.
#
# This file overrides whatever build settings are configured in the Netlify UI,
# so the deploy stays correct no matter how the site was first connected.

[build]
  # SITE_BASE_PATH mounts the whole project under a path, so one previews site
  # can carry several projects side by side:
  #   previews.<studio>/production/rebellion-a
  # The rebase step fixes the asset URLs Next's basePath does not reach. With
  # SITE_BASE_PATH unset both are no-ops and the site serves from the root.
  # Same three steps as the Plesk bundle: build, prune the switched-off
  # routes so they 404 for real, then fix the asset URLs Next's basePath does
  # not reach. With SITE_BASE_PATH unset the last step is a no-op and the site
  # serves from the domain root.
  command = "npm run build && node scripts/prune-hidden.mjs out && node scripts/rebase-assets.mjs out \"${SITE_BASE_PATH:-/}\""
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Set these in the Netlify UI (Site configuration -> Environment variables)
# BEFORE the first deploy, not after:
#
#   NEXT_PUBLIC_SITE_URL   https://rebellionbistro.com
#   NEXT_PUBLIC_INDEXABLE  true
#
# They are read at build time and baked into the output. Without the first,
# every canonical, Open Graph URL and sitemap entry points at the wrong host.
# Without the second, robots.txt says Disallow: / and every page carries a
# noindex tag — the site works perfectly and is invisible to search, which is
# the kind of thing nobody notices for a month.
#
# SITE_BASE_PATH stays unset here. It only applies to the subdirectory deploy
# on the client's own server; at a domain root both it and the rebase step are
# no-ops.

# The site was once deployed under /rebellionbistro on the client's own server,
# and something is still sending people to those addresses — 644 visits in the
# three weeks to 28 October 2026, every one of them landing on the 404 page and
# leaving within a second. That was the third most-visited address on the site.
#
# The old deploy mounted the whole project under that prefix, so the mapping is
# one for one: /rebellionbistro/menus is this site's /menus. Splat first, then
# the bare prefix, since the splat does not match a path with nothing after it.
#
# This is a patch over an unknown source, not a fix for it. Whatever is linking
# there — an old profile link, a printed code, a retired ad destination — still
# needs finding and correcting at the source.
[[redirects]]
  from = "/rebellionbistro/*"
  to = "/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/rebellionbistro"
  to = "/"
  status = 301
  force = true

# Long-cache the fingerprinted build assets; everything else stays revalidated
# so content edits appear immediately.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"
